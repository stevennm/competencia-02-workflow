[project]
name = "version-workflow-jueves"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "polars>=0.19.0",
    "numpy>=1.24.0",
    "lightgbm>=4.0.0",
    "optuna>=3.0.0",
    "tqdm>=4.65.0",
    "pyarrow>=22.0.0",
]

[project.scripts]
run-workflow = "run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
